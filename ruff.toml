# Ruff config for scrapeflow-modal. Matches the Modal image's Python (3.12).
target-version = "py312"
line-length = 88

[lint]
# Defaults (E, F) plus a few high-signal, low-noise rule sets.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "UP",  # pyupgrade (modernize syntax for the target version)
    "B",   # flake8-bugbear (likely bugs)
    "SIM", # flake8-simplify
]

[format]
quote-style = "double"
